name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name, for example 1.2.0"
        required: true
      versionCode:
        description: "Version code (defaults to the workflow run number)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
          INPUT_VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version_name="${INPUT_VERSION_NAME:?versionName is required for manual runs}"
          else
            version_name="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version_name" ]; then
            echo "Could not determine versionName" >&2
            exit 1
          fi
          version_code="${INPUT_VERSION_CODE:-${GITHUB_RUN_NUMBER}}"
          if ! printf '%s' "$version_code" | grep -Eq '^[1-9][0-9]*$'; then
            echo "versionCode must be a positive integer" >&2
            exit 1
          fi
          safe_name=$(printf '%s' "$version_name" | tr -c 'A-Za-z0-9._-' '-')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "safeName=$safe_name" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

      - name: Name release APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
            "NoteCraft-${{ steps.version.outputs.safeName }}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: notecraft-release
          path: NoteCraft-${{ steps.version.outputs.safeName }}.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: NoteCraft-${{ steps.version.outputs.safeName }}.apk
          generate_release_notes: true
